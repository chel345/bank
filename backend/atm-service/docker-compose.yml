version: "3.8"

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - atm-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - atm-network

  atm-service:
    build: .
    container_name: atm-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/atmdb
      - SPRING_DATASOURCE_USERNAME=atmuser
      - SPRING_DATASOURCE_PASSWORD=atmpass
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SERVER_PORT=8081
    networks:
      - atm-network
    depends_on:
      - postgres
      - kafka

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: atmdb
      POSTGRES_USER: atmuser
      POSTGRES_PASSWORD: atmpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - atm-network

networks:
  atm-network:
    driver: bridge

volumes:
  postgres_data: