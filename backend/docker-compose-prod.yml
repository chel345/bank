version: "3.8"

services:
  # ===== INFRASTRUCTURE =====
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT:-2181}
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "${ZOOKEEPER_CLIENT_PORT:-2181}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT:-zookeeper:2181}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:-PLAINTEXT://kafka:9092}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS:-PLAINTEXT://0.0.0.0:9092}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-true}
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:${KAFKA_PORT:-9092}"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ===== DATABASES =====
  postgres-atm:
    image: postgres:15-alpine
    container_name: postgres-atm
    environment:
      POSTGRES_DB: ${ATM_DB:-atmdb}
      POSTGRES_USER: ${ATM_USER:-atmuser}
      POSTGRES_PASSWORD: ${ATM_PASSWORD:-atmpass}
    volumes:
      - atm_data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ATM_USER:-atmuser} -d ${ATM_DB:-atmdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-branch:
    image: postgres:15-alpine
    container_name: postgres-branch
    environment:
      POSTGRES_DB: ${BRANCH_DB:-branchdb}
      POSTGRES_USER: ${BRANCH_USER:-bankuser}
      POSTGRES_PASSWORD: ${BRANCH_PASSWORD:-bankpass}
    volumes:
      - branch_data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BRANCH_USER:-bankuser} -d ${BRANCH_DB:-branchdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-order:
    image: postgres:15-alpine
    container_name: postgres-order
    environment:
      POSTGRES_DB: ${ORDER_DB:-orderdb}
      POSTGRES_USER: ${ORDER_USER:-bankuser}
      POSTGRES_PASSWORD: ${ORDER_PASSWORD:-bankpass}
    volumes:
      - order_data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_USER:-bankuser} -d ${ORDER_DB:-orderdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-card:
    image: postgres:15-alpine
    container_name: postgres-card
    environment:
      POSTGRES_DB: ${CARD_DB:-carddb}
      POSTGRES_USER: ${CARD_USER:-bankuser}
      POSTGRES_PASSWORD: ${CARD_PASSWORD:-bankpass}
    volumes:
      - card_data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CARD_USER:-bankuser} -d ${CARD_DB:-carddb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-client:
    image: postgres:15-alpine
    container_name: postgres-client
    environment:
      POSTGRES_DB: ${CLIENT_DB:-clientdb}
      POSTGRES_USER: ${CLIENT_USER:-bankuser}
      POSTGRES_PASSWORD: ${CLIENT_PASSWORD:-bankpass}
    volumes:
      - client_data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CLIENT_USER:-bankuser} -d ${CLIENT_DB:-clientdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-account:
    image: postgres:15-alpine
    container_name: postgres-account
    environment:
      POSTGRES_DB: ${ACCOUNT_DB:-accountdb}
      POSTGRES_USER: ${ACCOUNT_USER:-bankuser}
      POSTGRES_PASSWORD: ${ACCOUNT_PASSWORD:-bankpass}
    volumes:
      - account_data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ACCOUNT_USER:-bankuser} -d ${ACCOUNT_DB:-accountdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== MICROSERVICES =====
  atm-service:
    build:
      context: ./atm-service
      dockerfile: Dockerfile
    container_name: atm-service
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-atm:5432/${ATM_DB:-atmdb}
      - SPRING_DATASOURCE_USERNAME=${ATM_USER:-atmuser}
      - SPRING_DATASOURCE_PASSWORD=${ATM_PASSWORD:-atmpass}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:${KAFKA_PORT:-9092}
    networks:
      - bank-network
    depends_on:
      postgres-atm:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  branch-service:
    build:
      context: ./branch-service
      dockerfile: Dockerfile
    container_name: branch-service
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-branch:5432/${BRANCH_DB:-branchdb}
      - SPRING_DATASOURCE_USERNAME=${BRANCH_USER:-bankuser}
      - SPRING_DATASOURCE_PASSWORD=${BRANCH_PASSWORD:-bankpass}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:${KAFKA_PORT:-9092}
      - MANAGER_SECRET_KEY=${MANAGER_SECRET_KEY:-super-secret-manager-key-2024}
    networks:
      - bank-network
    depends_on:
      postgres-branch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    environment:
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-order:5432/${ORDER_DB:-orderdb}
      - SPRING_DATASOURCE_USERNAME=${ORDER_USER:-bankuser}
      - SPRING_DATASOURCE_PASSWORD=${ORDER_PASSWORD:-bankpass}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:${KAFKA_PORT:-9092}
      - MANAGER_SECRET_KEY=${MANAGER_SECRET_KEY:-super-secret-manager-key-2024}
    networks:
      - bank-network
    depends_on:
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  card-service:
    build:
      context: ./card-service
      dockerfile: Dockerfile
    container_name: card-service
    environment:
      - SERVER_PORT=8084
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-card:5432/${CARD_DB:-carddb}
      - SPRING_DATASOURCE_USERNAME=${CARD_USER:-bankuser}
      - SPRING_DATASOURCE_PASSWORD=${CARD_PASSWORD:-bankpass}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:${KAFKA_PORT:-9092}
      - MANAGER_SECRET_KEY=${MANAGER_SECRET_KEY:-super-secret-manager-key-2024}
    networks:
      - bank-network
    depends_on:
      postgres-card:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  client-service:
    build:
      context: ./client-service
      dockerfile: Dockerfile
    container_name: client-service
    environment:
      - SERVER_PORT=8085
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-client:5432/${CLIENT_DB:-clientdb}
      - SPRING_DATASOURCE_USERNAME=${CLIENT_USER:-bankuser}
      - SPRING_DATASOURCE_PASSWORD=${CLIENT_PASSWORD:-bankpass}
      - MANAGER_SECRET_KEY=${MANAGER_SECRET_KEY:-super-secret-manager-key-2024}
    networks:
      - bank-network
    depends_on:
      postgres-client:
        condition: service_healthy

  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: account-service
    environment:
      - SERVER_PORT=8086
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-account:5432/${ACCOUNT_DB:-accountdb}
      - SPRING_DATASOURCE_USERNAME=${ACCOUNT_USER:-bankuser}
      - SPRING_DATASOURCE_PASSWORD=${ACCOUNT_PASSWORD:-bankpass}
      - MANAGER_SECRET_KEY=${MANAGER_SECRET_KEY:-super-secret-manager-key-2024}
    networks:
      - bank-network
    depends_on:
      postgres-account:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8087}:8080"
    environment:
      - SERVER_PORT=8080
      - SERVICES_CLIENT_URL=http://client-service:8085
      - SERVICES_ACCOUNT_URL=http://account-service:8086
      - SERVICES_ATM_URL=http://atm-service:8081
      - SERVICES_BRANCH_URL=http://branch-service:8082
      - SERVICES_ORDER_URL=http://order-service:8083
      - SERVICES_CARD_URL=http://card-service:8084
      - JWT_SECRET=${JWT_SECRET:-your-256-bit-secret-key-change-in-production-env}
      - MANAGER_SECRET_KEY=${MANAGER_SECRET_KEY:-super-secret-manager-key-2024}
    networks:
      - bank-network
    depends_on:
      - client-service
      - account-service
      - atm-service
      - branch-service
      - order-service
      - card-service

networks:
  bank-network:
    driver: bridge

volumes:
  atm_data:
  branch_data:
  order_data:
  card_data:
  client_data:
  account_data: