version: "3.8"

services:
  # ===== INFRASTRUCTURE =====
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ===== DATABASES =====
  postgres-atm:
    image: postgres:15-alpine
    container_name: postgres-atm
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: atmdb
      POSTGRES_USER: atmuser
      POSTGRES_PASSWORD: atmpass
    volumes:
      - atm_data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atmuser -d atmdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-branch:
    image: postgres:15-alpine
    container_name: postgres-branch
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: branchdb
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: bankpass
    volumes:
      - branch_data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankuser -d branchdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-order:
    image: postgres:15-alpine
    container_name: postgres-order
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: bankpass
    volumes:
      - order_data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankuser -d orderdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-card:
    image: postgres:15-alpine
    container_name: postgres-card
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: carddb
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: bankpass
    volumes:
      - card_data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankuser -d carddb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-client:
    image: postgres:15-alpine
    container_name: postgres-client
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: clientdb
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: bankpass
    volumes:
      - client_data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankuser -d clientdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-account:
    image: postgres:15-alpine
    container_name: postgres-account
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: accountdb
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: bankpass
    volumes:
      - account_data:/var/lib/postgresql/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankuser -d accountdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== MICROSERVICES =====
  atm-service:
    build:
      context: ./atm-service
      dockerfile: Dockerfile
    container_name: atm-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-atm:5432/atmdb
      - SPRING_DATASOURCE_USERNAME=atmuser
      - SPRING_DATASOURCE_PASSWORD=atmpass
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - bank-network
    depends_on:
      postgres-atm:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  branch-service:
    build:
      context: ./branch-service
      dockerfile: Dockerfile
    container_name: branch-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-branch:5432/branchdb
      - SPRING_DATASOURCE_USERNAME=bankuser
      - SPRING_DATASOURCE_PASSWORD=bankpass
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MANAGER_SECRET_KEY=super-secret-manager-key-2024
    networks:
      - bank-network
    depends_on:
      postgres-branch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-order:5432/orderdb
      - SPRING_DATASOURCE_USERNAME=bankuser
      - SPRING_DATASOURCE_PASSWORD=bankpass
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MANAGER_SECRET_KEY=super-secret-manager-key-2024
    networks:
      - bank-network
    depends_on:
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  card-service:
    build:
      context: ./card-service
      dockerfile: Dockerfile
    container_name: card-service
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-card:5432/carddb
      - SPRING_DATASOURCE_USERNAME=bankuser
      - SPRING_DATASOURCE_PASSWORD=bankpass
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MANAGER_SECRET_KEY=super-secret-manager-key-2024
    networks:
      - bank-network
    depends_on:
      postgres-card:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  client-service:
    build:
      context: ./client-service
      dockerfile: Dockerfile
    container_name: client-service
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=8085
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-client:5432/clientdb
      - SPRING_DATASOURCE_USERNAME=bankuser
      - SPRING_DATASOURCE_PASSWORD=bankpass
      - MANAGER_SECRET_KEY=super-secret-manager-key-2024
    networks:
      - bank-network
    depends_on:
      postgres-client:
        condition: service_healthy

  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: account-service
    ports:
      - "8086:8086"
    environment:
      - SERVER_PORT=8086
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-account:5432/accountdb
      - SPRING_DATASOURCE_USERNAME=bankuser
      - SPRING_DATASOURCE_PASSWORD=bankpass
      - MANAGER_SECRET_KEY=super-secret-manager-key-2024
    networks:
      - bank-network
    depends_on:
      postgres-account:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8087:8080"
    environment:
      - SERVER_PORT=8080
      - SERVICES_CLIENT_URL=http://client-service:8085
      - SERVICES_ACCOUNT_URL=http://account-service:8086
      - SERVICES_ATM_URL=http://atm-service:8081
      - SERVICES_BRANCH_URL=http://branch-service:8082
      - SERVICES_ORDER_URL=http://order-service:8083
      - SERVICES_CARD_URL=http://card-service:8084
      - JWT_SECRET=your-256-bit-secret-key-change-in-production-env
      - MANAGER_SECRET_KEY=super-secret-manager-key-2024
    networks:
      - bank-network
    depends_on:
      - client-service
      - account-service
      - atm-service
      - branch-service
      - order-service
      - card-service

networks:
  bank-network:
    driver: bridge

volumes:
  atm_data:
  branch_data:
  order_data:
  card_data:
  client_data:
  account_data: